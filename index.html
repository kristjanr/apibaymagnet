<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apibay Magnet Search</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 28px;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #2563eb; }
        button.search-btn {
            padding: 12px 28px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        button.search-btn:hover { background-color: #1d4ed8; }
        .status {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 20px;
            font-size: 14px;
            min-height: 20px;
        }
        .result-item {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .result-info { flex: 1; min-width: 0; }
        .result-name {
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 6px;
            word-break: break-word;
            line-height: 1.4;
        }
        .result-meta { font-size: 13px; color: #9ca3af; display: flex; flex-wrap: wrap; gap: 12px; }
        .seeders { color: #10b981; }
        .leechers { color: #f43f5e; }
        .copy-btn {
            padding: 8px 18px;
            background-color: #059669;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }
        .copy-btn:hover { background-color: #047857; }
        .copy-btn.copied { background-color: #4b5563; cursor: default; }
    </style>
</head>
<body>
    <h1>Apibay Magnet Search</h1>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search torrents (e.g. rick morty)…"
               onkeydown="if(event.key==='Enter') performSearch()">
        <button class="search-btn" onclick="performSearch()">Search</button>
    </div>

    <div id="status-msg" class="status"></div>
    <div id="results-list"></div>

    <script>
        const TRACKERS = [
            "udp://tracker.opentrackr.org:1337",
            "udp://open.stealth.si:80/announce",
            "udp://tracker.torrent.eu.org:451/announce",
            "udp://tracker.bittor.pw:1337/announce",
            "udp://public.popcorn-tracker.org:6969/announce",
            "udp://tracker.dler.org:6969/announce",
            "udp://exodus.desync.com:6969",
            "udp://open.demonii.com:1337/announce",
            "udp://glotorrents.pw:6969/announce",
            "udp://p4p.arenabg.com:1337",
            "udp://tracker.internetwarriors.net:1337"
        ].map(t => "&tr=" + encodeURIComponent(t)).join("");

        function formatSize(bytes) {
            const n = parseInt(bytes);
            if (!n) return "0 B";
            const units = ["B","KB","MB","GB","TB"];
            const i = Math.floor(Math.log(n) / Math.log(1024));
            return (n / Math.pow(1024, i)).toFixed(2) + " " + units[i];
        }

        async function performSearch() {
            const query = document.getElementById("search-input").value.trim();
            const list  = document.getElementById("results-list");
            const msg   = document.getElementById("status-msg");
            if (!query) return;

            msg.textContent = "Searching…";
            list.innerHTML  = "";

            try {
                const q   = encodeURIComponent(query).replace(/%20/g, "+");
                const res = await fetch("https://apibay.org/q.php?q=" + q);
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();

                if (!data || !data.length || data[0].id === "0") {
                    msg.textContent = "No results found.";
                    return;
                }

                msg.textContent = "Found " + data.length + " result(s).";

                data.forEach(item => {
                    if (item.id === "0") return;
                    const magnet = "magnet:?xt=urn:btih:" + item.info_hash +
                                   "&dn=" + encodeURIComponent(item.name) + TRACKERS;

                    const row = document.createElement("div");
                    row.className = "result-item";
                    row.innerHTML =
                        '<div class="result-info">' +
                            '<div class="result-name">' + escHtml(item.name) + '</div>' +
                            '<div class="result-meta">' +
                                '<span class="seeders">▲ ' + item.seeders + '</span>' +
                                '<span class="leechers">▼ ' + item.leechers + '</span>' +
                                '<span>Size: ' + formatSize(item.size) + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<button class="copy-btn" data-magnet="">Copy Magnet</button>';

                    row.querySelector(".copy-btn").dataset.magnet = magnet;
                    row.querySelector(".copy-btn").addEventListener("click", function () {
                        navigator.clipboard.writeText(this.dataset.magnet).then(() => {
                            this.textContent = "Copied!";
                            this.classList.add("copied");
                            this.disabled = true;
                            setTimeout(() => {
                                this.textContent = "Copy Magnet";
                                this.classList.remove("copied");
                                this.disabled = false;
                            }, 2500);
                        }).catch(() => {
                            alert("Copy failed. Please copy manually:\n\n" + this.dataset.magnet);
                        });
                    });

                    list.appendChild(row);
                });
            } catch (err) {
                console.error(err);
                msg.textContent = "Error: could not reach apibay.org. " + err.message;
            }
        }

        function escHtml(str) {
            return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
        }
    </script>
</body>
</html>
