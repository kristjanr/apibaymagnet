<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apibay Magnet Search</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 28px;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #2563eb; }
        button.search-btn {
            padding: 12px 28px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        button.search-btn:hover { background-color: #1d4ed8; }
        button.search-btn:disabled { background-color: #374151; cursor: default; }
        .status {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 20px;
            font-size: 14px;
            min-height: 20px;
        }
        .result-item {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .result-info { flex: 1; min-width: 0; }
        .result-name {
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 6px;
            word-break: break-word;
            line-height: 1.4;
        }
        .result-meta { font-size: 13px; color: #9ca3af; display: flex; flex-wrap: wrap; gap: 12px; }
        .seeders { color: #10b981; }
        .leechers { color: #f43f5e; }
        .copy-btn {
            padding: 8px 18px;
            background-color: #059669;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }
        .copy-btn:hover { background-color: #047857; }
        .copy-btn.copied { background-color: #4b5563; cursor: default; }
        #debug-panel {
            margin-top: 32px;
            border: 1px solid #374151;
            border-radius: 8px;
            overflow: hidden;
        }
        #debug-header {
            background: #1f2937;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        #debug-header span { font-size: 13px; color: #9ca3af; font-family: monospace; }
        #debug-clear { font-size: 12px; color: #6b7280; background: none; border: none; cursor: pointer; padding: 2px 8px; }
        #debug-clear:hover { color: #f87171; }
        #debug-log {
            background: #0d1117;
            padding: 10px 14px;
            max-height: 320px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        .dlog { color: #9ca3af; }
        .dlog.error { color: #f87171; }
        .dlog.warn  { color: #fbbf24; }
        .dlog.info  { color: #60a5fa; }
        .dlog.req   { color: #a78bfa; }
        .dlog.res   { color: #34d399; }
        .dlog.res.fail { color: #f87171; }
        .dlog .ts   { color: #4b5563; margin-right: 6px; }
        #paste-section { margin-bottom: 20px; }
        #paste-section summary { cursor: pointer; color: #9ca3af; font-size: 14px; padding: 4px 0; user-select: none; }
        #paste-section summary:hover { color: #d1d5db; }
        .paste-hint { font-size: 13px; color: #6b7280; margin: 10px 0; line-height: 1.5; }
        .paste-hint code { background: #1e1e1e; padding: 2px 6px; border-radius: 4px; color: #9ca3af; word-break: break-all; }
        #json-input {
            width: 100%;
            min-height: 120px;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #1e1e1e;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            margin-bottom: 10px;
            outline: none;
        }
        #json-input:focus { border-color: #2563eb; }
    </style>
</head>
<body>
    <h1>Apibay Magnet Search</h1>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search torrents (e.g. rick morty)…"
               onkeydown="if(event.key==='Enter') performSearch()">
        <button class="search-btn" onclick="performSearch()">Search</button>
    </div>

    <details id="paste-section">
        <summary>Or paste apibay JSON manually (no proxy needed)</summary>
        <p class="paste-hint">Open
            <code>https://apibay.org/q.php?q=YOUR+SEARCH</code>
            in a browser tab, copy the whole JSON array, paste it below, then press Render.</p>
        <textarea id="json-input" placeholder='[{"id":"...","name":"...","info_hash":"...","seeders":"...","leechers":"...","size":"..."}]'></textarea>
        <button class="search-btn" onclick="renderFromJson()">Render from JSON</button>
    </details>

    <div id="status-msg" class="status"></div>
    <div id="results-list"></div>

    <div id="debug-panel">
        <div id="debug-header" onclick="toggleDebug()">
            <span>&#9660; Debug log</span>
            <button id="debug-clear" onclick="event.stopPropagation(); clearDebug()">clear</button>
        </div>
        <div id="debug-log"></div>
    </div>

    <script>
        // --- Debug panel ---
        const debugLog = document.getElementById("debug-log");
        let debugOpen = true;

        function toggleDebug() {
            debugOpen = !debugOpen;
            debugLog.style.display = debugOpen ? "block" : "none";
            document.querySelector("#debug-header span").textContent =
                (debugOpen ? "▼" : "►") + " Debug log";
        }
        function clearDebug() { debugLog.innerHTML = ""; }

        function dlog(msg, type) {
            const ts = new Date().toTimeString().slice(0,8);
            const el = document.createElement("div");
            el.className = "dlog " + (type || "");
            el.innerHTML = '<span class="ts">' + ts + '</span>' + escHtml(String(msg));
            debugLog.appendChild(el);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        // Intercept console
        ["log","info","warn","error"].forEach(level => {
            const orig = console[level].bind(console);
            console[level] = function(...args) {
                orig(...args);
                dlog("[" + level + "] " + args.map(a => {
                    try { return typeof a === "object" ? JSON.stringify(a) : String(a); }
                    catch(e) { return String(a); }
                }).join(" "), level);
            };
        });

        window.addEventListener("error", e => dlog("[uncaught] " + e.message + " @ " + e.filename + ":" + e.lineno, "error"));
        window.addEventListener("unhandledrejection", e => dlog("[promise] " + e.reason, "error"));

        async function debugFetch(url) {
            dlog("[req] GET " + url, "req");
            const t0 = Date.now();
            try {
                const res = await fetch(url);
                const ms  = Date.now() - t0;
                const ok  = res.ok;
                dlog("[res] " + res.status + " " + res.statusText + " (" + ms + "ms) " + url, "res" + (ok ? "" : " fail"));
                return res;
            } catch(err) {
                const ms = Date.now() - t0;
                dlog("[res] FAILED (" + ms + "ms) " + err.message, "res fail");
                throw err;
            }
        }
        // --- End debug panel ---

        const TRACKERS = [
            "udp://tracker.opentrackr.org:1337",
            "udp://open.stealth.si:80/announce",
            "udp://tracker.torrent.eu.org:451/announce",
            "udp://tracker.bittor.pw:1337/announce",
            "udp://public.popcorn-tracker.org:6969/announce",
            "udp://tracker.dler.org:6969/announce",
            "udp://exodus.desync.com:6969",
            "udp://open.demonii.com:1337/announce",
            "udp://glotorrents.pw:6969/announce",
            "udp://p4p.arenabg.com:1337",
            "udp://tracker.internetwarriors.net:1337"
        ].map(t => "&tr=" + encodeURIComponent(t)).join("");

        function formatSize(bytes) {
            const n = parseInt(bytes);
            if (!n || n < 0) return "0 B";
            const units = ["B","KB","MB","GB","TB"];
            const i = Math.floor(Math.log(n) / Math.log(1024));
            return (n / Math.pow(1024, i)).toFixed(2) + " " + units[i];
        }

        // Render an apibay result array (used by both live search and manual JSON paste)
        function renderResults(data) {
            const list = document.getElementById("results-list");
            const msg  = document.getElementById("status-msg");
            list.innerHTML = "";

            if (!Array.isArray(data)) {
                console.error("Expected a JSON array, got:", data);
                msg.textContent = "Error: data is not a JSON array (see debug log).";
                return;
            }

            if (!data.length || data[0].id === "0") {
                msg.textContent = "No results found.";
                return;
            }

            msg.textContent = "Found " + data.length + " result(s).";

            data.forEach(item => {
                if (item.id === "0") return;
                const magnet = "magnet:?xt=urn:btih:" + item.info_hash +
                               "&dn=" + encodeURIComponent(item.name) + TRACKERS;

                const row = document.createElement("div");
                row.className = "result-item";
                row.innerHTML =
                    '<div class="result-info">' +
                        '<div class="result-name">' + escHtml(item.name) + '</div>' +
                        '<div class="result-meta">' +
                            '<span class="seeders">▲ ' + escHtml(item.seeders) + '</span>' +
                            '<span class="leechers">▼ ' + escHtml(item.leechers) + '</span>' +
                            '<span>Size: ' + escHtml(formatSize(item.size)) + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<button class="copy-btn" data-magnet="">Copy Magnet</button>';

                const btn = row.querySelector(".copy-btn");
                btn.dataset.magnet = magnet;
                btn.addEventListener("click", function () {
                    navigator.clipboard.writeText(this.dataset.magnet).then(() => {
                        this.textContent = "Copied!";
                        this.classList.add("copied");
                        this.disabled = true;
                        setTimeout(() => {
                            this.textContent = "Copy Magnet";
                            this.classList.remove("copied");
                            this.disabled = false;
                        }, 2500);
                    }).catch(() => {
                        alert("Copy failed. Please copy manually:\n\n" + this.dataset.magnet);
                    });
                });

                list.appendChild(row);
            });
        }

        // Manually render from a pasted apibay JSON array (no network / proxy needed)
        function renderFromJson() {
            const raw = document.getElementById("json-input").value.trim();
            const msg = document.getElementById("status-msg");
            if (!raw) return;

            let data;
            try {
                data = JSON.parse(raw);
            } catch (e) {
                console.error("JSON parse failed:", e.message);
                document.getElementById("results-list").innerHTML = "";
                msg.textContent = "Invalid JSON: " + e.message;
                return;
            }
            renderResults(data);
        }

        let searching = false;

        async function performSearch() {
            if (searching) return;          // ignore re-entry while a request is in flight
            const query = document.getElementById("search-input").value.trim();
            const list  = document.getElementById("results-list");
            const msg   = document.getElementById("status-msg");
            const btn   = document.querySelector(".search-btn");
            if (!query) return;

            searching = true;
            btn.disabled = true;
            msg.textContent = "Searching…";
            list.innerHTML  = "";

            try {
                const q      = encodeURIComponent(query).replace(/%20/g, "+");
                const apiUrl = "https://apibay.org/q.php?q=" + q;
                const res = await debugFetch("https://corsproxy.io/?key=77d6db27&url=" + encodeURIComponent(apiUrl));
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                renderResults(data);
            } catch (err) {
                console.error(err);
                msg.textContent = "Error: could not reach apibay.org. " + err.message;
            } finally {
                searching = false;
                btn.disabled = false;
            }
        }

        function escHtml(str) {
            return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
        }
    </script>
</body>
</html>
